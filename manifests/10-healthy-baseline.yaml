# A fully healthy deployment/service, for contrast with the buggy ones.
# Use this as your "known-good" reference when practicing debugging.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-healthy
  namespace: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-healthy
  template:
    metadata:
      labels:
        app: frontend-healthy
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-healthy-svc
  namespace: frontend
spec:
  selector:
    app: frontend-healthy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
