# Workloads deployed to debug-cluster-2 (the "platform" cluster).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-collector
  template:
    metadata:
      labels:
        app: metrics-collector
    spec:
      containers:
        - name: collector
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo collecting metrics; sleep 30; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-collector-svc
  namespace: monitoring
spec:
  selector:
    app: metrics-collector
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
# BUG #10 (cluster-2): Service targetPort doesn't match container's actual
# listening port. Endpoints exist (pod IP:port registered), but any
# connection attempt gets "connection refused" since nothing listens on 9100.
apiVersion: v1
kind: Service
metadata:
  name: metrics-collector-svc-wrongport
  namespace: monitoring
spec:
  selector:
    app: metrics-collector
  ports:
    - port: 9090
      targetPort: 9100   # container doesn't listen here -> connection refused
  type: ClusterIP
