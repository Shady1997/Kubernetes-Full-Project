# BUG #5: Readiness probe checks the wrong path/port
# The app serves on :80 at "/", but the readiness probe checks "/healthz"
# on port 8081 which doesn't exist. Pod stays Running but never Ready,
# so the Service never routes traffic to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-gateway
  namespace: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-gateway
  template:
    metadata:
      labels:
        app: frontend-gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081   # wrong port: nginx only listens on 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-gateway-svc
  namespace: frontend
spec:
  selector:
    app: frontend-gateway
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
